# Multi-source queries for graph research
# Focus: graph algorithms reviews, GNN surveys, knowledge graph books, graph security

# ── Graph surveys/reviews (CrossRef — catches Springer/Elsevier/ACM) ──
- source: crossref
  query: graph neural network survey
  category: graph-neural-networks
  subcategory_hint: review
- source: crossref
  query: knowledge graph survey
  category: knowledge-graphs
  subcategory_hint: review
